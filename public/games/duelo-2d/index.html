<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Duelo da Live</title>

  <!-- PWA & Mobile Fullscreen Meta Tags -->

  <link rel="manifest" href="manifest.json">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="style.css">

  <style>
    /* Painel de presentes compacto para desktop e celular */
    .gifts-legend-container {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      z-index: 8;
      pointer-events: none;
    }

    .gifts-column {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: clamp(110px, 23%, 150px);
      min-width: 0;
    }

    .gift-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      min-height: 34px;
      padding: 4px 7px;
      background: linear-gradient(160deg, rgba(15,15,30,.88), rgba(30,20,60,.82));
      border: 1px solid rgba(255,210,70,.35);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      box-shadow: 0 3px 10px rgba(0,0,0,.7);
      box-sizing: border-box;
    }

    .gift-item img {
      display: block;
      width: 25px;
      height: 25px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.8));
    }

    .gift-label {
      min-width: 0;
      font-size: 10px;
      font-weight: 800;
      color: white;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.2;
      text-shadow: 0 1px 2px #000;
    }

    .gift-item.social-action {
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr);
      gap: 4px 5px;
    }

    .social-action img {
      grid-row: 1 / 3;
    }

    .social-action .gift-label {
      text-align: center;
    }

    .social-action .gift-action {
      grid-column: 2;
      justify-self: center;
    }

    .gift-action {
      display: inline-block;
      flex-shrink: 0;
      padding: 3px 6px;
      border-radius: 5px;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 0 1px 2px #000;
    }

    .gift-action.soco { background: #c0392b; }
    .gift-action.combo { background: #d4841a; }
    .gift-action.especial { background: #6c3fa1; }

    @media (max-width: 480px) {
      .gifts-legend-container { top: 6px; left: 7px; right: 7px; gap: 6px; }
      .gifts-column { width: 110px; max-width: 32%; gap: 6px; }
      .gift-item { min-height: 31px; padding: 4px 5px; gap: 3px; }
      .gift-item img { width: 21px; height: 21px; }
      .gift-item.social-action { grid-template-columns: 21px minmax(0, 1fr); }
      .gift-label { font-size: 9px; }
      .gift-action { font-size: 9px; padding: 3px 4px; }
    }
  </style>

</head>

<body>

  <div id="game">

    <!-- TÍTULO E BARRAS DE VIDA -->

    <header class="hud">

      <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 3.5%;">



        <button id="btnFullscreen" title="Tela Cheia"

          style="background: rgba(255,255,255,0.15); border: 1px solid #ffd94d; color: #ffd94d; font-size: 14px; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; z-index: 30;">⛶

          FULL</button>

      </div>

      <div class="health-bars">

        <div class="health-box">

          <div class="fighter-name">LULA</div>

          <div class="health-track">

            <div class="health-fill" id="hpLula"></div>

          </div>

          <span id="textLula">100 HP</span>

        </div>

        <div class="health-box right">

          <div class="fighter-name">FLÁVIO<br>BOLSONARO</div>

          <div class="health-track">

            <div class="health-fill" id="hpBolsonaro"></div>

          </div>

          <span id="textBolsonaro">100 HP</span>

        </div>

      </div>

      <div class="versus">VS</div>

    </header>

    <!-- ARENA -->

    <main class="arena">

      <!-- ================================================================= -->

      <!-- PAINEL DE COMANDOS DE PRESENTES (Comentar esta DIV para remover) -->

      <!-- ================================================================= -->

      <div class="gifts-legend-container">
        <!-- LULA: apenas ícones e ações -->
        <div class="gifts-column left">
          <div class="gift-item social-action">
  <img src="icones/tiktok-heart.png" alt="Curtidas">
  <span class="gift-label">200 curtidas</span>
  <span class="gift-action soco">SOCO</span>
</div>
          <div class="gift-item">
            <img src="icones/rose.webp" alt="Rose">
            <span class="gift-action soco">SOCO</span>
          </div>
          <div class="gift-item">
            <img src="icones/tiny-diny.webp" alt="Tiny Diny">
            <span class="gift-action combo">COMBO</span>
          </div>
          <div class="gift-item">
            <img src="icones/confetti.webp" alt="Confetti">
            <span class="gift-action especial">ESPECIAL</span>
          </div>
        </div>

        <!-- FLÁVIO: seguir e os presentes -->
        <div class="gifts-column right">
          <div class="gift-item social-action">
            <img src="icones/seguir.png" alt="Seguir">
            <span class="gift-label">Seguiu</span>
            <span class="gift-action soco">SOCO</span>
          </div>
          <div class="gift-item">
            <img src="icones/gg.webp" alt="GG">
            <span class="gift-action soco">SOCO</span>
          </div>
          <div class="gift-item">
            <img src="icones/heart.webp" alt="Heart">
            <span class="gift-action combo">COMBO</span>
          </div>
          <div class="gift-item">
            <img src="icones/heart-my-earthling.webp" alt="Heart My Earthling">
            <span class="gift-action especial">ESPECIAL</span>
          </div>
        </div>
      </div>
      <!-- ================================================================= -->

      <!-- CENÁRIO -->

      <video id="arenaVideo" class="arena-background" autoplay muted loop playsinline preload="auto" aria-hidden="true">
        <source src="ufc.mp4" type="video/mp4">
      </video>

      <!-- LUTADOR: LULA -->

      <div class="fighter lula" id="lula">

        <img id="spriteLula" src="sprites/lula/parado-1.png" alt="Lula em pixel art">

        <div class="placeholder">

          <div class="head"></div>

          <div class="torso"></div>

          <div class="arm"></div>

          <div class="legs"></div>

        </div>

        <div class="fighter-shadow"></div>

      </div>

      <!-- LUTADOR: BOLSONARO -->

      <div class="fighter bolsonaro" id="bolsonaro">

        <img id="spriteBolsonaro" src="sprites/bolsonaro/parado-1.png" alt="Bolsonaro em pixel art">

        <div class="placeholder">

          <div class="head"></div>

          <div class="torso"></div>

          <div class="arm"></div>

          <div class="legs"></div>

        </div>

        <div class="fighter-shadow"></div>

      </div>

      <!-- EFEITOS DOS GOLPES -->

      <div id="impact" class="impact"></div>

      <!-- BOLA DE ENERGIA DO ESPECIAL -->

      <div id="energiaEspecial" class="energia-especial"></div>

      <!-- TELA DE K.O. -->

      <div id="koOverlay" class="ko-overlay hidden">

        <div class="ko-title">K.O.!</div>

        <div id="winnerText" class="winner-text"></div>

      </div>

    </main>

    <!-- PLACAR -->

    <section class="scoreboard">

      <h2>🏆 VITÓRIAS</h2>

      <div class="score-row">

        <div class="score lula-score">

          <span>LULA</span>

          <strong id="winsLula">0</strong>

        </div>

        <div class="round-box">

          <span>RODADA</span>

          <strong id="roundNumber">1</strong>

        </div>

        <div class="score bolsonaro-score">

          <span>FLÁVIO<br>BOLSONARO</span>

          <strong id="winsBolsonaro">0</strong>

        </div>

      </div>

    </section>

  </div>

  <!-- SOCKET.IO: CONEXÃO COM O SERVIDOR -->

  <script src="/socket.io/socket.io.js"></script>

  <!-- MOTOR DO JOGO -->

  <script src="background-video.js"></script>

  <script src="game.js"></script>

  <!-- INTEGRAÇÃO COM OS PRESENTES DO TIKTOK -->

  <script src="tiktok-duelo.js"></script>

  <!-- REGISTRO PWA SERVICE WORKER & FULLSCREEN -->

  <script>

    if ('serviceWorker' in navigator) {

      window.addEventListener('load', () => {

        navigator.serviceWorker.register('./sw.js').catch(() => { });

      });

    }

    const btnFull = document.getElementById('btnFullscreen');

    if (btnFull) {

      btnFull.addEventListener('click', () => {

        const docEl = document.documentElement;

        if (!document.fullscreenElement && !document.webkitFullscreenElement) {

          if (docEl.requestFullscreen) {

            docEl.requestFullscreen();

          } else if (docEl.webkitRequestFullscreen) {

            docEl.webkitRequestFullscreen();

          }

        } else {

          if (document.exitFullscreen) {

            document.exitFullscreen();

          } else if (document.webkitExitFullscreen) {

            document.webkitExitFullscreen();

          }

        }

      });

    }

  </script>

</body>

</html>
